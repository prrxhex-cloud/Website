<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://* wss://*; img-src 'self' data: https://*; font-src 'self' data: https://*;" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <link rel="manifest" href="/manifest.json" />
    <title>PRRX HEX</title>
    <script>
      // ==========================================
      // ADVANCED SECURITY & ANTI-TAMPER SYSTEM
      // ==========================================
      (function() {
        // 1. Disable Right Click & Selection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        
        // 2. Block Keyboard Shortcuts (DevTools, Source, Save)
        document.addEventListener('keydown', function(e) {
          if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || // Ctrl+Shift+I/J/C
            (e.ctrlKey && [85, 83].includes(e.keyCode)) || // Ctrl+U, Ctrl+S
            (e.metaKey && e.altKey && [73, 74, 67].includes(e.keyCode)) // Mac equivalents
          ) {
            e.preventDefault();
            return false;
          }
        });

        // 3. Aggressive Debugger Trap
        const trap = function() {
          while (true) {
            debugger;
          }
        };
        
        // 4. Timing Analysis to Detect DevTools
        setInterval(() => {
          const t0 = performance.now();
          debugger;
          const t1 = performance.now();
          if (t1 - t0 > 100) {
            // DevTools is open and paused the debugger
            document.body.innerHTML = `
              <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#ff0000;font-family:monospace;flex-direction:column;">
                <h1>SECURITY VIOLATION DETECTED</h1>
                <p>UNAUTHORIZED ACCESS ATTEMPT LOGGED.</p>
              </div>
            `;
            trap();
          }
        }, 2000);

        // 5. Console clearing loop to prevent console reading
        setInterval(() => {
          console.clear();
          console.log("%cSTOP!", "color: red; font-size: 50px; font-weight: bold; text-shadow: 2px 2px 0 #000;");
          console.log("%cThis is a restricted area. All actions are logged.", "color: white; font-size: 16px;");
        }, 1000);

      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
