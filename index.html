<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PRRX HEX" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://* wss://*; img-src 'self' data: https://*; font-src 'self' data: https://*;" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <link rel="manifest" href="/manifest.json" />
    <title>PRRX HEX</title>
    <script>
      // ==========================================
      // ADVANCED SECURITY & ANTI-TAMPER SYSTEM
      // ==========================================
      (function() {
        // 1. Disable Right Click & Selection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        
        // 2. Block Keyboard Shortcuts (DevTools, Source, Save)
        document.addEventListener('keydown', function(e) {
          if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || // Ctrl+Shift+I/J/C
            (e.ctrlKey && [85, 83].includes(e.keyCode)) || // Ctrl+U, Ctrl+S
            (e.metaKey && e.altKey && [73, 74, 67].includes(e.keyCode)) // Mac equivalents
          ) {
            e.preventDefault();
            return false;
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
